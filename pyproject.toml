[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="purpose-execution-finality-validation"
version="1.0.0"
requires-python=">=3.11"
dependencies=["cryptography>=41"]
[project.optional-dependencies]
test=["pytest>=8"]
[tool.pytest.ini_options]
pythonpath=["src"]
addopts="-q"
